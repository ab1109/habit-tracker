# Defaults are for local development (docker compose on 5433). Every setting a
# deployment needs to change is read from an environment variable.
spring:
  application:
    name: habit-tracker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:habit_tracker}
    username: ${DB_USER:habit_tracker}
    password: ${DB_PASSWORD:habit_tracker}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  autoconfigure:
    # No username/password logins: users sign in with Google (the 'google'
    # profile) or, locally, are identified by the X-User-Id header.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${PORT:8080}
