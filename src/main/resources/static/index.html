<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cohabit</title>
  <meta name="description" content="Habit tracking, together. Private, shared or joint habits for your circles.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%231B1A20'/%3E%3Ccircle cx='12.8' cy='16' r='6' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='19.2' cy='16' r='6' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
  <script>
    // Resolve the theme before first paint so there is no light flash in dark mode.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('cohabit.theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="boot">Loading Cohabit…</div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
